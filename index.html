<!DOCTYPE html>
<html lang="en">
    <head>
        <title>survey Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
    
        <div class="container">

            <h1>Student Survey Form</h1>
            <p class="description">
                Please fill out this form to help us understand your preferences.
            </p>

            <form id="surveyForm">

                <!-- Name -->
                 <label for="name">Full Name</label>
                 <input type="text" id="name" placeholder="Enter your name">

                 <!--Email-->
                 <label for="email">Email</label>
                 <input type="email" id="email" placeholder="Enter your email">

                 <!--Age-->
                 <label for ="age">Age</label>
                 <input type="number" id="age" placeholder="Enter your age">

                 <!-- Gender -->
                 <label>Gender</label>
                 
                 <div class="option">
                    <input type="radio" name="gender" value="Male">
                    <span>Male</span>
                 </div>

                 <div class="option">
                    <input type="radio" name="gender" value="Female">
                    <span>Female</span>
                 </div>

                 <div class="option">
                    <input type="radio" name="gender" value="Other"
                    <span>Other</span>
                 </div>


                 <!-- Course -->
                 <label for="course">Select Your Course</label>
                 
                 <select id="course">
                    <option value="">--Select Course --</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="B.sc">B.sc</option>
                    <option value="B.Tech">B.Tech</option>
                 </select>

                 <!--Skills-->
                 <label>Which skills are you interested in?</label>

                 <div class="option">
                    <input type="checkbox" name="skills" value="HTML">
                    <span>HTML</span>
                 </div>

                 <div class="option">
                    <input type="checkbox" name="skills" value="CSS">
                    <span>CSS</span>
                 </div>

                 <div class="option">
                    <input type="checkbox" name="skills" value="JavaScript">
                    <span>JavaScript</span>
                 </div>

                 <div class="option">
                    <input type="checkbox" name="skills" value="Python">
                    <span>Python</span>
                 </div>

                 <!-- Rating -->
                 <label for="rating">Rating your learning experience</label>
                 <input
                    type="range"
                    id="rating"
                    min="1"
                    max="10"
                    value="5">

                    <p>Rating: <span id="ratingValue">5</span>/10</p>

                    <!-- Feedback -->
                     <label for="feedback">Your Feedback</label>

                     <textarea
                     id="feedback"
                     rows="5"
                     placeholder="Write your feedback..."></textarea>


                     <!--Submit-->
                     <button type="submit">Submit Survey</button>

            </form>

            <div id="message"></div>
        </div>
        <script src="script.js"></script>

    </body>
</html>
